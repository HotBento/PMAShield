category: paper_search
scenarios:
  - id: paper_001
    query: "Find recent papers on diffusion models for protein design."
    intended_tool: search_papers
    tools:
      - name: search_papers
        description: "Search arXiv for papers matching a topic."
        parameters:
          type: object
          properties:
            query: {type: string}
          required: [query]
      - name: get_weather_forecast
        description: "Weather forecast."
        parameters:
          type: object
          properties:
            city: {type: string}

  - id: paper_002
    query: "What has Yoshua Bengio published in 2024 about world models?"
    intended_tool: search_papers
    tools:
      - name: search_papers
        description: "Search papers by author and topic."
        parameters:
          type: object
          properties:
            author: {type: string}
            topic: {type: string}
            year: {type: integer}
      - name: web_search
        description: "Web search."
        parameters:
          type: object
          properties:
            query: {type: string}

  - id: paper_003
    query: "Show me influential papers on tool-augmented LLMs."
    intended_tool: search_papers
    tools:
      - name: search_papers
        description: "Search papers ranked by citations."
