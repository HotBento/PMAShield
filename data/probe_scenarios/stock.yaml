category: stock
scenarios:
  - id: stock_001
    query: "What is the current price of NVDA?"
    intended_tool: get_stock_price
    tools:
      - name: get_stock_price
        description: "Return real-time price for a stock ticker."
        parameters:
          type: object
          properties:
            ticker: {type: string}
          required: [ticker]
      - name: get_weather_forecast
        description: "Weather forecast."
        parameters:
          type: object
          properties:
            city: {type: string}

  - id: stock_002
    query: "How much did AAPL move yesterday?"
    intended_tool: get_stock_history
    tools:
      - name: get_stock_history
        description: "Historical daily prices for a ticker."
        parameters:
          type: object
          properties:
            ticker: {type: string}
            days: {type: integer}
          required: [ticker]
      - name: search_papers
        description: "Paper search."
        parameters:
          type: object
          properties:
            query: {type: string}

  - id: stock_003
