category: weather
scenarios:
  - id: weather_001
    query: "What will the weather be like in Tokyo tomorrow afternoon?"
    intended_tool: get_weather_forecast
    tools:
      - name: get_weather_forecast
        description: "Return an hourly weather forecast for a given city and date."
        parameters:
          type: object
          properties:
            city: {type: string}
            date: {type: string, description: "ISO date"}
          required: [city]
      - name: search_papers
        description: "Search academic papers by topic."
        parameters:
          type: object
          properties:
            query: {type: string}
          required: [query]

  - id: weather_002
    query: "Is it going to rain in Berlin this evening?"
    intended_tool: get_weather_forecast
    tools:
      - name: get_weather_forecast
        description: "Hourly weather forecast for a city."
        parameters:
          type: object
          properties:
            city: {type: string}
          required: [city]
      - name: get_stock_price
        description: "Get the current price of a stock by ticker."
        parameters:
          type: object
          properties:
            ticker: {type: string}
          required: [ticker]

  - id: weather_003
